<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Constraint, Visualized — PACLAND</title>
<style>
  :root { --bg:#05070f; --panel:rgba(12,16,30,.82); --accent:#5eead4; --accent2:#a78bfa; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; overflow:hidden; }
  #scene { position:fixed; inset:0; display:block; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #topbar { position:absolute; top:0; left:0; right:0; padding:18px 22px;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size:20px; font-weight:700; letter-spacing:.5px; }
  h1 .grad { background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sub { font-size:12px; color:var(--muted); margin-top:4px; max-width:520px; line-height:1.5; }
  #tabs { display:flex; gap:8px; pointer-events:auto; flex-wrap:wrap; }
  .tab { padding:9px 16px; border-radius:10px; background:var(--panel); border:1px solid rgba(255,255,255,.08);
    color:var(--text); font-size:13px; cursor:pointer; transition:.18s; backdrop-filter:blur(8px); }
  .tab:hover { border-color:rgba(94,234,212,.4); }
  .tab.active { background:linear-gradient(90deg,rgba(94,234,212,.18),rgba(167,139,250,.18)); border-color:rgba(94,234,212,.5); }
  #readout { position:absolute; bottom:20px; left:22px; pointer-events:auto; background:var(--panel);
    border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:14px 18px; backdrop-filter:blur(8px);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px; line-height:1.7; }
  #readout .k { color:var(--muted); }
  #readout .v { color:var(--accent); font-weight:600; }
  #legend { position:absolute; right:22px; bottom:20px; background:var(--panel); border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:12px 16px; font-size:12px; color:var(--muted); line-height:1.6; backdrop-filter:blur(8px); }
  #legend b { color:var(--text); }
  .hint { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); font-size:11px; color:var(--muted); opacity:.7; }
  @media (max-width:640px){
    #readout,#legend{ display:none; }
    .sub{ max-width:92vw; }
    #topbar{ padding:12px 14px; gap:10px; }
    h1{ font-size:17px; }
    #tabs{ gap:6px; width:100%; }
    .tab{ padding:7px 11px; font-size:11px; }

<body>
<canvas id="scene"></canvas>
<div id="hud">
  <div id="topbar">
    <div>
      <h1>The Constraint, <span class="grad">Visualized</span></h1>
      <div class="sub">3D views of the theorem tower — the D3 tadpole as a symplectic invariant, and the uplift potential that keeps the landscape metastable.</div>
    </div>
    <div id="tabs">
      <button class="tab active" data-scene="symplectic">① The tadpole = area</button>
      <button class="tab" data-scene="kpv">② The KPV uplift</button>
      <button class="tab" data-scene="orbit">③ The flux orbit</button>
      <button class="tab" data-scene="cone">④ The LCS cone</button>
      <button class="tab" data-scene="constraint">⑤ The constraint</button>
      <button class="tab" data-scene="sm">⑥ 19 vs 1</button>
      <button class="tab" data-scene="hodge">⑦ Three generations</button>
    </div>
  </div>
  <div id="readout"></div>
  <div id="legend"></div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070f, 0.045);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(4.2, 3.2, 6.5);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

// lights
scene.add(new THREE.AmbientLight(0x8899cc, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(5,7,4); scene.add(key);
const rim = new THREE.DirectionalLight(0xa78bfa, 1.2); rim.position.set(-4,-2,-3); scene.add(rim);

// shared groups
const groupSymp = new THREE.Group();
const groupKPV = new THREE.Group();
scene.add(groupSymp, groupKPV);
groupKPV.visible = false;

const readout = document.getElementById('readout');
const legend = document.getElementById('legend');

/* ---------------- ① symplectic invariant: the tadpole = area ---------------- */
const F0 = new THREE.Vector2(1.35, 0.55), H0 = new THREE.Vector2(-0.30, 1.25);

function drawVector(color, from, to){
  const dir = new THREE.Vector3(to.x-from.x, to.y-from.y, 0);
  const len = dir.length();
  return new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(from.x,from.y,0), len, color, 0.28, 0.13);
}

const para = new THREE.Mesh(new THREE.PlaneGeometry(1,1), new THREE.MeshBasicMaterial({ color:0x5eead4, side:THREE.DoubleSide, transparent:true, opacity:.16, depthWrite:false }));
const paraEdge = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color:0x5eead4, transparent:true, opacity:.7 }));

// grid in the z=0 plane
const grid = new THREE.GridHelper(6, 24, 0x223355, 0x112233);
grid.rotation.x = Math.PI/2;
groupSymp.add(para, paraEdge, grid);

let cur = { nf:null, nh:null, ns:null };
function updatePara(F, H){
  if (cur.nf) groupSymp.remove(cur.nf, cur.nh, cur.ns);
  const pts = [[0,0],[F.x,F.y],[F.x+H.x,F.y+H.y],[H.x,H.y],[0,0]];
  const v3 = pts.map(p => new THREE.Vector3(p[0], p[1], 0));
  paraEdge.geometry.dispose();
  paraEdge.geometry = new THREE.BufferGeometry().setFromPoints(v3);
  const q = [0,0,0, F.x,F.y,0, F.x+H.x,F.y+H.y,0, H.x,H.y,0];
  para.geometry.dispose();
  para.geometry = new THREE.BufferGeometry();
  para.geometry.setAttribute('position', new THREE.Float32BufferAttribute(q,3));
  para.geometry.setIndex([0,1,2, 0,2,3]);
  para.geometry.computeVertexNormals();
  const nf = drawVector(0x5eead4, new THREE.Vector3(), new THREE.Vector3(F.x,F.y,0));
  const nh = drawVector(0xa78bfa, new THREE.Vector3(), new THREE.Vector3(H.x,H.y,0));
  const ns = drawVector(0xffffff, new THREE.Vector3(), new THREE.Vector3(F.x+H.x,F.y+H.y,0));
  groupSymp.add(nf, nh, ns);
  cur = { nf, nh, ns };
  return cur;
}
updatePara(F0, H0);

/* ---------------- ② KPV uplift potential surface ---------------- */
function kpvV(psi, r){ // r = p/M, b0^2 ~ 0.93266
  const b0 = Math.sqrt(0.93266);
  const s2 = 0.5*Math.sin(2*psi);
  const root = Math.sqrt(Math.pow(b0,4)*Math.pow(Math.sin(psi),4) + Math.pow(Math.PI*r - psi + s2, 2));
  const M = 8; // control regime g_s M ~ 8
  return r + (M/Math.PI)*(root - psi + s2);
}
const Npsi = 120, Nr = 60;
const psiMin = 0.0, psiMax = 1.15, rMin = 0.02, rMax = 0.14;
const surfPos = [], surfCol = [];
const cmap = (t) => { // teal -> purple -> pink
  const c = new THREE.Color();
  c.lerpColors(new THREE.Color(0x0ea5e9), new THREE.Color(0xa78bfa), Math.min(1, t*1.6));
  if (t > 0.62) c.lerp(new THREE.Color(0xf472b6), (t-0.62)/0.38);
  return c;
};
let vmin = Infinity, vmax = -Infinity;
const Vvals = [];
for (let j=0;j<=Nr;j++){
  const r = rMin + (rMax-rMin)*j/Nr;
  for (let i=0;i<=Npsi;i++){
    const psi = psiMin + (psiMax-psiMin)*i/Npsi;
    const v = kpvV(psi, r);
    Vvals.push(v); if(v<vmin)vmin=v; if(v>vmax)vmax=v;
  }
}
let idx = 0;
for (let j=0;j<=Nr;j++){
  const r = rMin + (rMax-rMin)*j/Nr;
  for (let i=0;i<=Npsi;i++){
    const psi = psiMin + (psiMax-psiMin)*i/Npsi;
    const v = Vvals[idx++];
    const t = (v-vmin)/(vmax-vmin);
    const x = (psi/psiMax)*4.2 - 1.6;
    const y = (r-rMin)/(rMax-rMin)*3.0 - 1.5;
    const z = t*2.6;
    surfPos.push(x, y, z);
    const c = cmap(t);
    surfCol.push(c.r, c.g, c.b);
  }
}
const surfGeom = new THREE.BufferGeometry();
surfGeom.setAttribute('position', new THREE.Float32BufferAttribute(surfPos,3));
surfGeom.setAttribute('color', new THREE.Float32BufferAttribute(surfCol,3));
const inds = [];
for (let j=0;j<Nr;j++) for (let i=0;i<Npsi;i++){
  const a = j*(Npsi+1)+i, b = a+1, c = a+(Npsi+1), d = c+1;
  inds.push(a,b,c, b,d,c);
}
surfGeom.setIndex(inds);
surfGeom.computeVertexNormals();
const surf = new THREE.Mesh(surfGeom, new THREE.MeshStandardMaterial({ vertexColors:true, roughness:.5, metalness:.15, side:THREE.DoubleSide }));
groupKPV.add(surf);
groupKPV.rotation.y = -0.6; groupKPV.rotation.x = 0.35; groupKPV.position.z = -0.2;

// the p/M = 0.08 control plane (metastable boundary)
const cutPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(4.3, 0.04),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:.25, side:THREE.DoubleSide })
);
cutPlane.rotation.x = Math.PI/2;
cutPlane.position.set(0.5, 0, 1.0);
groupKPV.add(cutPlane);

/* ---------------- ③ flux orbit: the tadpole level sets = Sp orbits ---------------- */
const groupOrbit = new THREE.Group();
scene.add(groupOrbit);
groupOrbit.visible = false;

function hyperboloidSheet(a, segT=30, segTh=60){
  const pos = [], inds = [], tR = 1.15, W = segTh+1;
  for (let j=0;j<=segT;j++){
    const tt = -tR + 2*tR*j/segT;
    const ct = Math.cosh(tt), st = Math.sinh(tt);
    for (let i=0;i<=segTh;i++){
      const th = 2*Math.PI*i/segTh;
      pos.push(a*ct*Math.cos(th), a*st, a*ct*Math.sin(th));
    }
  }
  for (let j=0;j<segT;j++) for (let i=0;i<segTh;i++){
    const a0=j*W+i, b0=a0+1, c0=a0+W, d0=c0+1;
    inds.push(a0,b0,c0, b0,d0,c0);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(inds); g.computeVertexNormals();
  return g;
}
[[0.7,0x5eead4],[1.0,0xa78bfa],[1.3,0xf472b6]].forEach(([a,col]) => {
  groupOrbit.add(new THREE.Mesh(hyperboloidSheet(a), new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:.12, transparent:true, opacity:.32, side:THREE.DoubleSide, roughness:.35, metalness:.2 })));
});
groupOrbit.rotation.x = 0.55;

/* ---------------- ④ LCS cone: the facet explosion (3 -> 26 -> 35,610) ---------------- */
const groupCone = new THREE.Group();
scene.add(groupCone);
groupCone.visible = false;

const rays5 = [[0,0.7071,-0.7071],[0,0,1],[0.4101,-0.8157,-0.4079]];
const rays10 = [
 [-0.8333,0.1866,0.4034],[-0.8323,0.0759,-0.4788],[-0.6611,-0.1481,-0.2232],
 [0.9318,0.0623,-0.1397],[0.9327,-0.0046,-0.1246],[0.7274,0.8798,-0.2799],
 [0.8809,-0.4209,-0.0176],[-0.4985,-0.2217,0.4057],[0.3105,-0.6828,-0.1406],
 [-0.8093,0.006,-0.4673],[0.7949,0.7286,-0.2608],[0.6756,-0.7112,0.0228],
 [-0.8871,0.1311,0.3194],[0.9327,-0.0105,-0.1233],[-0.5704,-0.2389,-0.426],
 [-0.8123,0.1722,0.4571],[-0.9271,0.0991,0.0618],[0.6919,1.0,0.0518],
 [0.7508,0.056,0.3963],[0.5997,0.4249,0.4584],[0.809,-0.5966,0.1431],
 [-0.7846,0.1307,0.4367],[-0.8362,0.0406,-0.47],[-0.7355,-0.0563,-0.4419],
 [-0.535,-0.1918,0.4097],[0.685,-0.7105,0.0274],
];
const rays15 = [];
for (let i=0;i<900;i++){
  const y = 1 - 2*(i+0.5)/900, r = Math.sqrt(Math.max(0,1-y*y)), phi = i*2.39996;
  rays15.push([r*Math.cos(phi), y, r*Math.sin(phi)]);
}
const coneStates = [
  { label:'h12 = 5', count:'3', rays:rays5 },
  { label:'h12 = 10', count:'26', rays:rays10 },
  { label:'h12 = 15', count:'35,610', rays:rays15, schematic:true },
];
let coneRays = new THREE.Group();
groupCone.add(coneRays);
function renderCone(state){
  groupCone.remove(coneRays);
  coneRays = new THREE.Group();
  state.rays.forEach(r => {
    const dir = new THREE.Vector3(r[0],r[1],r[2]).normalize().multiplyScalar(2.1);
    coneRays.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), dir]),
      new THREE.LineBasicMaterial({ color:0x5eead4, transparent:true, opacity:.55 })
    ));
  });
  groupCone.add(coneRays);
}
renderCone(coneStates[0]);

/* ---------------- ⑤ constraint: the boundary that only eliminates ---------------- */
const groupConst = new THREE.Group();
scene.add(groupConst);
groupConst.visible = false;

const L = -0.5;
const constBoundary = new THREE.Mesh(hyperboloidSheet(1.0), new THREE.MeshStandardMaterial({ color:0xf87171, emissive:0xf87171, emissiveIntensity:.16, transparent:true, opacity:.26, side:THREE.DoubleSide, roughness:.4, metalness:.1 }));
groupConst.add(constBoundary);

const NPOINTS = 460;
let seeded = 42; const rand = () => { seeded = (seeded*1664525+1013904223)>>>0; return seeded/4294967296; };
const cPt = new THREE.BufferGeometry();
const cPos = new Float32Array(NPOINTS*3), cCol = new Float32Array(NPOINTS*3);
for (let i=0;i<NPOINTS;i++){
  const u=(rand()*2-1)*2.4, v=(rand()*2-1)*2.4, p=(rand()*2-1)*2.4;
  const N=(u*u-v*v-p*p)/2, allowed = N <= L;
  cPos[i*3]=u; cPos[i*3+1]=v; cPos[i*3+2]=p;
  const c = allowed ? new THREE.Color(0x5eead4) : new THREE.Color(0xf87171);
  cCol[i*3]=c.r; cCol[i*3+1]=c.g; cCol[i*3+2]=c.b;
}
cPt.setAttribute('position', new THREE.BufferAttribute(cPos,3));
cPt.setAttribute('color', new THREE.BufferAttribute(cCol,3));
const cPts = new THREE.Points(cPt, new THREE.PointsMaterial({ size:0.055, vertexColors:true, transparent:true, opacity:.95, depthWrite:false }));
groupConst.add(cPts);

/* ---------------- ⑥ 19 vs 1: the orbit-space dimension ---------------- */
const groupSM = new THREE.Group();
scene.add(groupSM);
groupSM.visible = false;

const fluxAxis = new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.035,3.6,16), new THREE.MeshStandardMaterial({ color:0x5eead4, emissive:0x5eead4, emissiveIntensity:.7, roughness:.3 }));
fluxAxis.position.x = -1.8;
groupSM.add(fluxAxis);
const axisCap = new THREE.Mesh(new THREE.SphereGeometry(0.1,16,16), new THREE.MeshStandardMaterial({ color:0x5eead4, emissive:0x5eead4, emissiveIntensity:.8 }));
axisCap.position.set(-1.8, 1.9, 0);
groupSM.add(axisCap);

const smTypes = [['gauge',3,0x5eead4],['mass',9,0xa78bfa],['ckm',4,0xf472b6],['higgs',2,0x38bdf8],['theta',1,0xfbbf24]];
let si = 0;
for (const [type,count,col] of smTypes){
  for (let k=0;k<count;k++){
    const phi = si*2.39996, yy = 1 - 2*(si+0.5)/19, rr = Math.sqrt(Math.max(0,1-yy*yy));
    const x = rr*Math.cos(phi), z = rr*Math.sin(phi);
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.085,16,16), new THREE.MeshStandardMaterial({ color:col, emissive:col, emissiveIntensity:.55, roughness:.3 }));
    dot.position.set(x+1.8, yy*1.4, z);
    groupSM.add(dot);
    si++;
  }
}


/* ---------------- ⑦ the three-generation web ---------------- */
const groupHodge = new THREE.Group();
scene.add(groupHodge);
groupHodge.visible = false;

const hPos = [], hCol = [];
for (const [h11,h12,c] of HODGE){
  hPos.push(HX(h11), HY(h12), Math.log10(1+c)*1.15);
  const chi = 2*(h11-h12);

groupHodge.add(new THREE.Points(hGeom, new THREE.PointsMaterial({ size:0.085, vertexColors:true, transparent:true, opacity:.85, depthWrite:false })));

// the chi = +-6 slice (three generations) — highlighted
const s6Pos = [], s6Col = [];
for (const [h11,h12,c] of HODGE){
  if (Math.abs(2*(h11-h12)) !== 6) continue;
  s6Pos.push(HX(h11), HY(h12), Math.log10(1+c)*1.15 + 0.04);
  s6Col.push(1, 0.75, 0.14);
}
const s6Geom = new THREE.BufferGeometry();
s6Geom.setAttribute('position', new THREE.Float32BufferAttribute(s6Pos,3));
s6Geom.setAttribute('color', new THREE.Float32BufferAttribute(s6Col,3));
groupHodge.add(new THREE.Points(s6Geom, new THREE.PointsMaterial({ size:0.16, vertexColors:true, transparent:true, opacity:1, depthWrite:false })));

// the (1,4)/(4,1) Z12 quotient — non-toric, below the wall
function quotientMarker(h11,h12){
  const g = new THREE.Group();
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.16,20,20), new THREE.MeshStandardMaterial({ color:0xf472b6, emissive:0xf472b6, emissiveIntensity:1.1, roughness:.2 }));

  g.add(dot);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.26,0.02,10,32), new THREE.MeshBasicMaterial({ color:0xf472b6, transparent:true, opacity:.9 }));
  ring.position.set(HX(h11), HY(h12), 0);
  g.add(ring);
  return g;
}
groupHodge.add(quotientMarker(1,4));
groupHodge.add(quotientMarker(4,1));

// mirror diagonal (h11 = h12) and the toric wall (h11+h12 = 28)
groupHodge.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(HX(1),HY(1),0), new THREE.Vector3(HX(40),HY(40),0)]), new THREE.LineBasicMaterial({ color:0x94a3b8, transparent:true, opacity:.3 })));

/* ---------------- UI switching ---------------- */
const tabs = document.querySelectorAll('.tab');
const legendSymp = `<b>Mitchell's Uniqueness.</b> The D3 tadpole <b>N = FᵀJH = F₁H₂ − F₂H₁</b> is the signed <b>area</b> of the parallelogram spanned by the two flux vectors. A symplectic shear (det = 1) deforms the parallelogram — but the area is <b>invariant</b>. That one invariant is the entire exact content of the flux sector.`;
const legendKPV = `<b>Machine ① — the uplift-control solver.</b> The anti-D3 potential V(ψ) as a surface over (ψ, p/M). Below the white <b>p/M = 0.08</b> line the minimum is metastable (dS); above it there is no minimum (monotonic). Height = potential, color = height.`;
const legendOrbit = `<b>Mitchell's Completeness.</b> Each value of the tadpole <b>N = FᵀJH</b> is a single Sp-orbit — shown here as a hyperboloid sheet (a slice of the level set). The invariant <b>labels</b> the orbit: nothing else distinguishes vacua on the same sheet.`;
const legendCone = `<b>The LCS cone.</b> The complex-structure moduli's convergence region, as a hedgehog of extreme rays (actual double-description count on the KS model). The facet count explodes <b>3 → 26 → 35,610</b> as h12 goes 5 → 10 → 15 — the geometric reason "sample then test the cone" becomes a lottery.`;
const legendConst = `<b>Complete Exact Structure.</b> The red hyperboloid is the constraint <b>N = L</b>. Teal points satisfy <b>N ≤ L</b> (allowed); red points violate it (forbidden). The constraint is a boundary — it can only <b>eliminate</b>, never select. That is the whole exact content the theory gets to enforce.`;
const legendHodge = `<b>Three generations from topology.</b> Each point is a Kreuzer–Skarke manifold (h¹¹, h²¹); height = log count. Teal = χ<0, purple = χ>0, grey = χ=0 (self-mirror). <b>Amber = χ = ±6</b> — the three-generation manifolds, <b>N_gen = |χ|/2 = 3</b>. The pink rings are the <b>(1,4)/(4,1) manifold</b> (π₁ = Z₁₂, Braun–Candelas–Davies), a <em>free quotient</em> that sits below the white toric wall h¹¹+h²¹ = 28 — toric CYs cannot reach its five moduli.`;
const legendSM = `<b>The orbit-space dimension.</b> Left: the flux sector has <b>1</b> invariant (the tadpole — one axis). Right: the Standard Model has <b>19</b> free parameters (teal = 3 gauge, purple = 9 masses, pink = 4 CKM, blue = 2 Higgs, amber = θ). A theory of everything predicts <em>relations, never values</em> — and no completion derives more than 2 of the 19 correctly.`;
legend.innerHTML = legendSymp;

const legendMap = { symplectic:legendSymp, kpv:legendKPV, orbit:legendOrbit, cone:legendCone, constraint:legendConst, sm:legendSM, hodge:legendHodge };
function showScene(name){
  groupSymp.visible = name === 'symplectic';
  groupKPV.visible = name === 'kpv';
  groupOrbit.visible = name === 'orbit';
  groupCone.visible = name === 'cone';
  groupConst.visible = name === 'constraint';
  groupSM.visible = name === 'sm';
  groupHodge.visible = name === 'hodge';
  legend.innerHTML = legendMap[name];
  controls.target.set(0,0,0);
  if (name === 'symplectic') camera.position.set(4.2, 3.2, 6.5);
  else if (name === 'kpv') camera.position.set(5, 4, 6);
  else if (name === 'sm') camera.position.set(5.5, 2.8, 6.5);
  else if (name === 'hodge') camera.position.set(6.5, 4.0, 6.5);
  else camera.position.set(3.5, 2.6, 5.2);
}
tabs.forEach(t => t.addEventListener('click', () => {
  tabs.forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  showScene(t.dataset.scene);
}));

/* ---------------- animation ---------------- */
const clock = new THREE.Clock();
let t = 0, curConeState = -1;
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t += dt;
  if (groupSymp.visible){
    // symplectic shear S(t) = [[1, s],[0,1]] acts F1 -> F1 + s*F2 (det=1 => area invariant)
    const s = 1.1*Math.sin(t*0.9);
    const F = new THREE.Vector2(F0.x + s*F0.y, F0.y);
    const H = new THREE.Vector2(H0.x + s*H0.y, H0.y);
    const N = F.x*H.y - F.y*H.x;
    const N0 = F0.x*H0.y - F0.y*H0.x;
    updatePara(F, H);
    readout.innerHTML =
      `<div><span class="k">tadpole N = F₁H₂ − F₂H₁</span> = <span class="v">${N.toFixed(4)}</span></div>` +
      `<div><span class="k">shear parameter s =</span> <span class="v">${s.toFixed(3)}</span> &nbsp;·&nbsp; <span class="k">det(S) = 1</span></div>` +
      `<div><span class="k">N₀ (initial) =</span> <span class="v">${N0.toFixed(4)}</span> &nbsp;·&nbsp; <span class="k">ΔN =</span> <span class="v">${(N-N0).toExponential(1)}</span></div>`;
  } else if (groupKPV.visible){
    readout.innerHTML =
      `<div><span class="k">V(ψ) = p + (M/π)[√(b₀⁴sin⁴ψ + (pπ/M − ψ + ½sin2ψ)²) − ψ + ½sin2ψ]</span></div>` +
      `<div><span class="k">metastable (dS)</span> <span class="v">iff p/M &lt; 0.08</span> · <span class="k">white line = the boundary</span></div>`;
    groupKPV.rotation.y += dt*0.12;
  } else if (groupOrbit.visible){
    groupOrbit.rotation.y += dt*0.25;
    readout.innerHTML =
      `<div><span class="k">N = F₁H₂ − F₂H₁ = c</span> · <span class="v">each sheet is one Sp-orbit</span></div>` +
      `<div><span class="k">the invariant labels the orbit — nothing else distinguishes vacua on the same sheet</span></div>`;
  } else if (groupCone.visible){
    const si = Math.floor(t/3.5) % 3;
    const st = coneStates[si];
    if (curConeState !== si){ renderCone(st); curConeState = si; }
    groupCone.rotation.y += dt*0.2;
    readout.innerHTML =
      `<div><span class="k">LCS cone</span> · <span class="v">${st.label}</span> · <span class="v">${st.count}</span> <span class="k">extreme rays</span>${st.schematic ? ' <span class="k">(illustrative — full set too dense)</span>' : ''}</div>` +
      `<div><span class="k">facet count explodes 3 → 26 → 35,610 with h12</span></div>`;
  } else if (groupConst.visible){
    groupConst.rotation.y += dt*0.18;
    readout.innerHTML =
      `<div><span class="k">constraint N ≤ L</span> · <span class="v">teal = allowed</span> · <span class="v">red = forbidden (eliminated)</span></div>` +
      `<div><span class="k">the boundary can only eliminate, never select</span></div>`;
  } else if (groupHodge.visible){
    groupHodge.rotation.y += dt*0.12;
    readout.innerHTML =
      `<div><span class="k">three generations = |χ|/2 = 3</span> → <span class="v">χ = ±6</span> (amber slice)</div>` +
      `<div><span class="k">toric 3-gen starts at (13,16)</span> · <span class="v">200k+ each sign</span></div>` +
      `<div><span class="k">(1,4)/(4,1) = Z₁₂ quotient</span> <span class="v">π₁ ≠ 0</span> — below the toric wall h¹¹+h²¹ = 28</div>`;
  } else if (groupSM.visible){
    groupSM.rotation.y += dt*0.15;
    readout.innerHTML =
      `<div><span class="k">flux</span> = <span class="v">1 invariant</span> (the tadpole) &nbsp;·&nbsp; <span class="k">SM</span> = <span class="v">19 free parameters</span></div>` +
      `<div><span class="k">relations, never values — no completion derives more than 2 correctly</span></div>`;
  }
  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
