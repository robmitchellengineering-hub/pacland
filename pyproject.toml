[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pacland"
version = "0.1.0"
description = "Probably Approximately Correct Landscape - Valiant-verification for the string landscape"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rob Mitchell" }]

[project.scripts]
pacland = "pacland.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
