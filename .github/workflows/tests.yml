# The suite, run where a PR can be judged by it.
#
# WHY THIS EXISTED FIRST AND IS REQUIRED SECOND
#
# pacland had tests/ and no workflow, so main was protected and gating nothing. Requiring a check that no workflow
# produces makes every PR permanently unmergeable, so this landed as a PROBE: it runs, we look at whether the suite is
# green today, and only then is `tests` added to the required checks on main.
#
# The probe earned its keep immediately: the first run failed with 19 collection errors, all of them
# ModuleNotFoundError for numpy, sympy and mpmath - the suite's real dependencies, which pyproject.toml does not
# declare. That is information, not breakage: had `tests` been required first, every PR here would have been blocked
# by an undeclared dependency.
name: tests

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # The suite imports these; pyproject.toml declares none of them. Until that is fixed upstream, CI installs
          # them explicitly - a gate must be runnable before it can be required.
          pip install numpy==2.0.2 sympy==1.14.0 mpmath==1.3.0
          pip install -e . || echo "editable install failed; testing against the tree"

      - name: Run the suite
        run: python -m pytest tests -q
